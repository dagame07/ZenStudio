# Siguiente paso: activar con SPRING_PROFILES_ACTIVE=mysql y definir DB_URL, DB_USER y DB_PASSWORD.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # solo para el primer arranque; después migrar a Flyway y usar "validate"
